buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url "$rootDir/../node_modules/react-native/android"
        }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2' // Updated Gradle plugin version
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 33 // Updated to current SDK version

    defaultConfig {
        minSdkVersion 21 // Updated minimum SDK version (16 is too old)
        targetSdkVersion 33 // Updated target SDK version
        versionCode 1
        versionName "1.0"
    }
    
    lintOptions {
        abortOnError false
    }
    
    sourceSets {
        main {
            aidl.srcDirs = ['src/main/java']
        }
    }
}

repositories {
    mavenCentral()
    google()
    maven {
        // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
        url "$rootDir/../node_modules/react-native/android"
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'  // From node_modules
    implementation 'androidx.appcompat:appcompat:1.6.1' // Replaced old support library
    implementation "com.google.zxing:core:3.5.1" // Updated version
}